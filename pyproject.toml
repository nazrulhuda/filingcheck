[project]
name = "filingcheck"
version = "0.1.0"
description = "An LLM agent for SEC 10-K questions whose tools check every argument the model sends before they run."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nazrul Huda Shanto" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filingcheck"]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "RUF", "D"]
# Docstrings are required on public functions and classes, optional on
# modules, packages, magic methods and __init__.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------- mypy (strict-ish)
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["filingcheck", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false  # pytest fixtures and marks are untyped

# ---------------------------------------------------------------- pytest + coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the local Postgres from `make db-up`",
    "slow: runs on real cached SEC data; skipped when it is not present",
]

[tool.coverage.run]
source = ["filingcheck"]
branch = true

[tool.coverage.report]
show_missing = true
