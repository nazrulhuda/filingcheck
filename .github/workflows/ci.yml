name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, so the tag week6-measured is there
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating v10 tag
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --locked
      - name: Lint and type-check
        run: make lint
      - name: Unit tests with coverage
        run: make test
      - name: The deterministic gate (21 scripted scenarios, facts fixture)
        run: make eval-smoke
      - name: The measured system is unchanged since the tag week6-measured
        run: make verify-measured
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  reproduce:
    name: Reproduce the report (no keys, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --locked
      - name: Recompute the report from the committed rows and grades
        run: make report
      - name: The report and every CSV it writes are unchanged (the chart images are redrawn, not compared)
        run: |
          git diff --exit-code --stat -- \
            eval/results/2026-11-14_final_report.md \
            eval/results/2026-11-14_final_report.csv \
            docs/results/final_rates.csv \
            docs/results/final_difference.csv \
            docs/results/final_check_activity.csv \
            docs/results/final_summary.csv \
            web/data/results.json

  integration:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filingcheck
          POSTGRES_PASSWORD: filingcheck
          POSTGRES_DB: filingcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filingcheck -d filingcheck"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://filingcheck:filingcheck@localhost:5432/filingcheck
      REQUIRE_DB: "1"  # fail, do not skip, if the database is missing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --locked
      - name: Integration tests
        run: make test-integration

  web:
    name: Web page (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies from the lock file
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests (the citation cases are shared with the API's tests)
        run: npm test
      - name: Build
        run: npm run build
