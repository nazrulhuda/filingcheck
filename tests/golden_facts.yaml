# Facts read by hand from the filings on sec.gov, as an independent check on the XBRL code.
#
# How to verify one: open source_url, find the line named in where_to_look, copy the number
# exactly as printed (in the units the statement states), fill in value_as_printed and
# printed_units, convert it to raw units in value (dollars, not millions), and set
# verified_by_hand: true.
#
# The four facts were read on 2026-11-04 from the printed consolidated statement in each
# source_url document, fetched from sec.gov: the visible table row and the statement's own
# units line ("in millions"), not the XBRL tags, so they cannot share a bug with the XBRL code.
#
# Every fact marked verified_by_hand: true must be reproduced exactly by the XBRL code
# (tests/test_golden_facts.py enforces the format now; the fact check is added with that code).

facts:
  - id: jpm-fy2023-total-net-revenue
    ticker: JPM
    fiscal_year: 2023
    period_end: 2023-12-31
    metric: revenue
    xbrl_tag: us-gaap:RevenuesNetOfInterestExpense
    where_to_look: Consolidated statements of income, line "Total net revenue"
    source_url: https://www.sec.gov/Archives/edgar/data/19617/000001961724000225/jpm-20231231.htm
    expected_around: "158,104 million USD"
    value_as_printed: "158,104"
    printed_units: millions
    value: 158104000000
    unit: USD
    verified_by_hand: true

