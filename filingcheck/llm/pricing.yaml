# US dollars per million tokens, as published by each provider. Every cost the project
# reports is computed from this file. Re-check the prices before relying on a total.
# Chat models are keyed "provider:model" (the same model costs differently elsewhere) and
# need both an input and an output price.
checked_on: 2026-11-02
models:
  text-embedding-3-small:
    input_per_million: 0.02
    source: https://developers.openai.com/api/docs/models/text-embedding-3-small
  groq:openai/gpt-oss-20b:
    input_per_million: 0.075
    output_per_million: 0.30
    source: https://console.groq.com/docs/model/openai/gpt-oss-20b
  # The Groq host's price on OpenRouter (the provider is pinned to Groq), from
  # GET https://openrouter.ai/api/v1/models/openai/gpt-oss-20b/endpoints on 2026-11-02.
  openrouter:openai/gpt-oss-20b:
    input_per_million: 0.075
    output_per_million: 0.30
    source: https://openrouter.ai/openai/gpt-oss-20b/providers
  # The paid list price. A free-tier key is not billed for these calls, but the reports count
  # what the calls would cost on the paid tier. Thinking tokens are billed as output.
  gemini:gemini-3.5-flash-lite:
    input_per_million: 0.30
    output_per_million: 2.50
    source: https://ai.google.dev/gemini-api/docs/pricing
  fake-embeddings:  # tests only
    input_per_million: 0.0
  fake:chat:  # tests only
    input_per_million: 0.0
    output_per_million: 0.0
