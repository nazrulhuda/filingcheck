# Chat providers and per-model settings. Rule: send only parameters the provider documents,
# and keep the provider's own default unless there is a stated reason. Each value was read
# from the provider's docs on the date below; docs/decisions.md lists the pages and reasons.
# Adding a provider or model means reading its docs first.
checked_on: 2026-11-02
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # Groq's API reference marks max_tokens as deprecated in favour of this name.
    token_limit_param: max_completion_tokens
    source: https://console.groq.com/docs/api-reference
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    # Not documented on Google's OpenAI-compatibility page; sent anyway so that one cap holds
    # for every model the API uses. Confirmed live (a tiny limit must end with "length").
    token_limit_param: max_tokens
    source: https://ai.google.dev/gemini-api/docs/openai
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # OpenRouter's parameters page lists max_tokens (max_completion_tokens is an alias).
    token_limit_param: max_tokens
    source: https://openrouter.ai/docs/api/reference/parameters
models:
  groq:openai/gpt-oss-20b:
    # Groq's reasoning page: default 0.6, best between 0.5 and 0.7. Its API reference says
    # "Defaults to 1" for all models; the model-specific value is sent so the default is fixed.
    temperature: 0.6
    params:
      # Default "medium". Low: fewer reasoning tokens under the 700-token cap and the
      # per-minute token limit.
      reasoning_effort: low
      # Default true. The answer text is all we use; reasoning is not returned.
      include_reasoning: false
    json_schema: false  # not checked yet; checked before anything asks for structured output
    source: https://console.groq.com/docs/reasoning
  openrouter:openai/gpt-oss-20b:
    # The same model on the same host as groq:openai/gpt-oss-20b, through prepaid OpenRouter
    # credit. OpenRouter's default is 1.0; Groq's recommended 0.6 is sent, as for groq:.
    temperature: 0.6
    params:
      # Only Groq's servers, never another host: OpenRouter lists about ten hosts for this
      # model, at other prices and quantizations. With no allowed host OpenRouter answers 404.
      provider:
        only: [groq]
        allow_fallbacks: false
      # OpenRouter's reasoning setting (not Groq's reasoning_effort / include_reasoning).
      # exclude: the reasoning is not returned; it is still billed as output.
      reasoning:
        effort: low
        exclude: true
    json_schema: false  # not checked yet
    source: https://openrouter.ai/docs/guides/routing/provider-selection
  gemini:gemini-3.5-flash-lite:
    # No temperature: Google strongly recommends the default 1.0 for Gemini 3 models.
    # No reasoning_effort: the model's default thinking level is "minimal".
    temperature: null
    params: {}
    json_schema: false  # not checked yet
    source: https://ai.google.dev/gemini-api/docs/thinking
